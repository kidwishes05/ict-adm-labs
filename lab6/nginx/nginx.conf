events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    log_format lab6 '$remote_addr $host "$request" $status';

    access_log /dev/stdout lab6;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 0;

    server {
        listen 80;

        server_name
            gitlab.lab.test
            registry.lab.test
            sso.lab.test
            grafana.lab.test;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name gitlab.lab.test;

        location ~ ^/admin(?:/|$) {
            include /etc/nginx/admin-allow.conf;
            include /etc/nginx/proxy.conf;

            proxy_pass http://gitlab:80;
        }

        location = /users/sign_in {
            limit_req zone=login burst=5 nodelay;

            include /etc/nginx/proxy.conf;

            proxy_pass http://gitlab:80;
        }

        location / {
            include /etc/nginx/proxy.conf;

            proxy_pass http://gitlab:80;
        }
    }

    server {
        listen 443 ssl;
        server_name registry.lab.test;

        location / {
            include /etc/nginx/proxy.conf;

            proxy_request_buffering off;

            proxy_pass http://gitlab:5000;
        }
    }

    server {
        listen 443 ssl;
        server_name sso.lab.test;

        location / {
            include /etc/nginx/proxy.conf;

            proxy_pass http://keycloak:8080;
        }
    }

    server {
        listen 443 ssl;
        server_name grafana.lab.test;

        location / {
            include /etc/nginx/proxy.conf;

            proxy_pass http://grafana:3000;
        }
    }

    server {
        listen 8080;

        location = /stub_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }
}