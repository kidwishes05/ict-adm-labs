global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: postgres
    scrape_timeout: 4s

    static_configs:
      - targets:
          - exporter-primary:9187
        labels:
          node: primary

      - targets:
          - exporter-replica:9187
        labels:
          node: replica