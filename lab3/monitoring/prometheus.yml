global:
  scrape_interval: 10s       # как часто опрашивать экспортеры
  evaluation_interval: 10s   # как часто вычислять правила алертов

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kafka          # кластер и группы: лаг, offset'ы, реплики
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: node           # хост: диск с данными Kafka, память, CPU
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus     # Prometheus следит и за собой
    static_configs:
      - targets: ["localhost:9090"]
